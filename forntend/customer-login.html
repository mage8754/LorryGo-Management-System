<!DOCTYPE html>
<html>
<head>
    <title>Customer Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-container">
    <div class="login-box">

        <h2>👤 Customer Login</h2>
        <p class="sub">Welcome back!</p>

        <input type="email" id="c_email" placeholder="Email">
        <input type="password" id="c_password" placeholder="Password">

        <p id="c_error" class="error"></p>

        <button onclick="customerLogin()">Login</button>

        <p class="link">
            New user? <a href="customer-register.html">Create account</a>
        </p>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
