<!DOCTYPE html>
<html>
<head>
    <title>Driver Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-box">
    <h2>🚚 Driver Register</h2>

    <input id="d_name" placeholder="Name">
    <input id="d_email" placeholder="Email">
    <input type="password" id="d_password" placeholder="Password">
    <input id="d_vehicle" placeholder="Vehicle Number">
    <input id="d_phone" placeholder="Phone Number" maxlength="10">
    

    <p id="d_error"></p>

    <button onclick="driverRegister()">Register</button>

    <a href="driver-login.html">Login</a>
</div>

<script src="script.js"></script>
</body>
</html>
