<!DOCTYPE html>
<html>
<head>
    <title>Driver Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-container">
    <div class="login-box">

        <h2>🚚 Driver Login</h2>
        <p class="sub">Drive & Earn 🚀</p>

        <input type="email" id="d_email" placeholder="Email">
        <input type="password" id="d_password" placeholder="Password">

        <p id="d_error" class="error"></p>

        <button onclick="driverLogin()">Login</button>

        <p class="link">
            New driver? <a href="driver-register.html">Register</a>
        </p>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
