<!DOCTYPE html>
<html>
<head>
    <title>Customer Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-box">
    <h2>👤 Customer Register</h2>

    <input id="c_name" placeholder="Name">
    <input id="c_email" placeholder="Email">
    <input id="c_password" type="password" placeholder="Password">
    <input id="c_phone" placeholder="Phone Number">

    <p id="c_error"></p>

     <button onclick="customerRegister()">Register</button>
    <a href="customer-login.html">Login</a>
</div>

<script src="script.js"></script>
</body>
</html>
