<!DOCTYPE html>
<html>
<head>
<title>Driver Dashboard</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
text-align:center;
}

.search-card{
    width:95%;
    max-width:900px;
    margin:25px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.search-card h3{
    color:#111827;
    margin-bottom:20px;
    text-align:center;
}

.search-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    color:#374151;
    font-weight:bold;
    margin-bottom:8px;
}

.field input{
    padding:15px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.field input:focus{
    border-color:#f59e0b;
}

.search-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#f59e0b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.order{
    background:white;
    color:#111827;
    width:420px;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    border-left:8px solid #f59e0b;
}

button{
padding:8px 12px;
margin:5px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
font-weight:bold;
}

.accept-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
.suggestion-box{
    background:white;
    color:black;
    max-height:250px;
    overflow-y:auto;
    border-radius:10px;
    margin-top:5px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    text-align:left;
}

.suggestion-box div{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.suggestion-box div:hover{
    background:#f3f4f6;
}

</style>

</head>

<body>

<h2>🚚 Driver Orders</h2>

<div class="search-card">

    <h3>🔍 Find Available Loads</h3>

    <div class="search-grid">

<div class="field">
    <label>📍 Pickup Location</label>
 
       <input
       type="text"
       id="searchPickup"
      placeholder="Enter Pickup Location">

    <div id="pickupList"
    class="suggestion-box"></div>
</div>

        <div class="field">
    <label>🎯 Drop Location</label>

    <input
    type="text"
    id="searchDrop"
    placeholder="Enter Drop Location">

    <div id="dropList"
    class="suggestion-box"></div>
</div>

    <button class="search-btn"
    onclick="searchOrders()">
    🚚 Search Available Loads
    </button>

</div>
</div>
<div id="orders"></div>

<script>
    async function getPlaces(inputId, listId){

    const query = document.getElementById(inputId).value.trim();

    if(query.length < 2){
        document.getElementById(listId).innerHTML="";
        return;
    }

    const res = await fetch("data/places.json");
    const places = await res.json();

    const result = places.filter(place =>
        place.toLowerCase().startsWith(query.toLowerCase())
    ).slice(0,20);

    let html="";

    result.forEach(place=>{

        html += `
        <div onclick="
            document.getElementById('${inputId}').value='${place}';
            document.getElementById('${listId}').innerHTML='';
        ">
            ${place}
        </div>
        `;

    });

    document.getElementById(listId).innerHTML = html;

}


// ✅ LOAD ORDERS
function loadOrders(){

fetch("http://localhost:5000/orders")
.then(res=>res.json())
.then(data=>{

const container=document.getElementById("orders");
container.innerHTML="";

data.forEach((o)=>{

container.innerHTML+=`
<div class="order">

<p><b>Pickup:</b> ${o.pickup}</p>
<p><b>Drop:</b> ${o.drop}</p>

<p><b>Load:</b> ${o.load || "N/A"}</p>
<p><b>LorryType:</b> ${o.lorry_type || "N/A"}</p>

<p><b>Weight:</b> ${o.weight || "N/A"} kg</p>
<p><b>Distance:</b> ${o.distance || "N/A"} km</p>

<p><b>Price:</b> ₹${o.price || "Not set"}</p>

${o.photo ? `<img src="http://localhost:5000/uploads/${o.photo}" width="120">` : ""}

<p><b>Status:</b> ${o.status}</p>

<p><b>Customer:</b> ${o.customer_name || "N/A"}</p>
<p><b>Phone:</b> ${o.customer_phone || "N/A"}</p>

${o.customer_phone ? `
<button onclick="callCustomer('${o.customer_phone}')" 
style="background:purple;">
📞 Call Customer
</button>
` : ""}

${o.status === "pending" ? `
<button onclick="acceptOrder('${o._id}')" style="background:green;">✅ Accept Order</button>
<button onclick="updateOrder('${o._id}','rejected')" style="background:red;">Reject</button>
` : ""}



</div>
`;

});

});

}

function searchOrders(){

    const pickup =
    document.getElementById("searchPickup").value;

    const drop =
    document.getElementById("searchDrop").value;
    
    alert("Pickup = " + pickup + "\nDrop = " + drop);

    fetch(
`http://localhost:5000/driver-search?pickup=${pickup}&drop=${drop}`
    )
    .then(res => res.json())
    .then(data => {

        console.log("Search Result:", data);
        alert(JSON.stringify(data));

        const container =
        document.getElementById("orders");

        console.log("Container:", container);

        container.innerHTML = "";

        console.log("Data Length:", data.length);
        console.log(data);

        if(data.length === 0){

            container.innerHTML = `
            <div class="order">
            ❌ No Orders Available
            </div>`;
            return;
        }

        data.forEach((o)=>{

            container.innerHTML += `
            <div class="order">

            <h3>🚚 Available Load</h3>

            <p><b>Order ID:</b> ${o._id}</p>
            <p><b>Status:</b> ${o.status || 'N/A'}</p>

            <p><b>From:</b> ${o.pickup}</p>

            <p><b>To:</b> ${o.drop}</p>

            <p><b>Load:</b> ${o.load}</p>

            <p><b>Weight:</b> ${o.weight} kg</p>

            <p><b>Distance:</b> ${o.distance} km</p>

            <p><b>Customer:</b>
            ${o.customer_name}</p>

            <p><b>Phone:</b>
            ${o.customer_phone}</p>

            <button
            onclick="acceptOrder('${o._id}')"
            style="background:green;">
            Accept Order
            </button>

            </div>
            `;
        });

    });

}

// 📍 DRIVER LIVE LOCATION SEND (FIXED)
navigator.geolocation.watchPosition((position) => {

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    const driverId = localStorage.getItem("user_id");

    console.log("Sending:", lat, lng);

    fetch("http://localhost:5000/update-location", { // ✅ fixed API
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ driverId, lat, lng }) // ✅ fixed keys
    });

});

// ✅ ACCEPT
function acceptOrder(orderId){

const driver_id = localStorage.getItem("user_id");

fetch("http://localhost:5000/accept_order", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
order_id: orderId,
driver_id: driver_id
})
})
.then(res => res.text())
.then(data => {

alert("Accepted ✅");

try {
    const json = JSON.parse(data);

    if(json.whatsappLink){
        window.open(json.whatsappLink);
    }
} catch(e) {
    console.log("No JSON response");
}

loadOrders();
});
}

// ✅ REJECT + COMPLETE
function updateOrder(orderId, status){

fetch(`http://localhost:5000/update_order/${orderId}`,{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({status})
})
.then(()=>loadOrders());

}

// 📞 CALL CUSTOMER
function callCustomer(phone){
if(!phone){
alert("Phone not available ❌");
return;
}
window.location.href = "tel:" + phone;
}

document
.getElementById("searchPickup")
.addEventListener("keyup", () => {

    getPlaces(
        "searchPickup",
        "pickupList"
    );

});

document
.getElementById("searchDrop")
.addEventListener("keyup", () => {

    getPlaces(
        "searchDrop",
        "dropList"
    );

});

// START
loadOrders();
//setInterval(loadOrders,3000);

</script>

</body>
</html>
